<!DOCTYPE html>
<html lang="en" class="light theme-booting" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta id="theme-color-meta" name="theme-color" content="#f8fafc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perplexta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Perplexta AI" />
    <meta name="msapplication-TileColor" content="#f8fafc" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="edge-sidebar" content="disable" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Canonical Theme & Language Bootstrap (Executes synchronously before first paint) -->
    <script>
      (function () {
        const STORAGE_KEY = 'perplexta.theme.bootstrap.v1';
        const MODE_KEY = 'perplexta.theme.mode.v1';
        const root = document.documentElement;

        try {
          // Language & Direction bootstrap
          const savedLang = localStorage.getItem('language') || 'en';
          root.setAttribute('lang', savedLang);
          root.setAttribute('dir', savedLang === 'ar' ? 'rtl' : 'ltr');

          // Mode resolution
          const savedMode = localStorage.getItem(MODE_KEY) || localStorage.getItem('perplexta_theme') || localStorage.getItem('theme');
          const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

          const requestedMode =
            savedMode === 'light' || savedMode === 'dark' || savedMode === 'system'
              ? savedMode
              : 'light';

          const resolvedMode =
            requestedMode === 'system'
              ? (systemDark ? 'dark' : 'light')
              : requestedMode;

          root.dataset.theme = resolvedMode;
          root.classList.toggle('dark', resolvedMode === 'dark');
          root.classList.toggle('light', resolvedMode === 'light');
          root.style.colorScheme = resolvedMode;

          const meta = document.getElementById('theme-color-meta') || document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', resolvedMode === 'dark' ? '#080c14' : '#f8fafc');
          }

          // Apply saved tokens if available
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const payload = JSON.parse(raw);
            if (payload && payload.version === 1 && payload.tokens) {
              const modeTokens = payload.tokens[resolvedMode];
              if (modeTokens && typeof modeTokens === 'object') {
                for (const [key, value] of Object.entries(modeTokens)) {
                  if (
                    typeof key === 'string' &&
                    key.startsWith('--') &&
                    typeof value === 'string' &&
                    value.length <= 200
                  ) {
                    root.style.setProperty(key, value);
                  }
                }
              }
            }
          }
        } catch (_) {
          /* Fallback remains intact */
        }
      })();
    </script>

    <style>
      :root.dark,
      :root[data-theme="dark"] {
        --pwa-theme-color: #080c14;
        --pwa-bg-color: #080c14;
        color-scheme: dark;
      }
      :root.light,
      :root[data-theme="light"] {
        --pwa-theme-color: #f8fafc;
        --pwa-bg-color: #f8fafc;
        color-scheme: light;
      }
      html {
        background-color: var(--surface-page, var(--pwa-bg-color));
        color-scheme: dark light;
      }
      body {
        background-color: var(--surface-page, var(--pwa-bg-color));
        margin: 0;
        padding: 0;
      }
    </style>
    
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- PWA Setup & Icons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Perplexta</title>
    <meta name="description" content="Professional Elite AI Analytics & Strategic Intelligence Platform" />
    <meta property="og:title" content="Perplexta" />
    <meta property="og:description" content="Professional Elite AI Analytics & Strategic Intelligence Platform" />

    <link rel="manifest" href="/manifest.json" />
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        if (typeof window !== 'undefined' && window.dispatchEvent) {
          window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
        }
      });
    </script>
  </head>
  <body class="layout-locked">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Deferred Script Loader for Non-Essential Third-Party Analytics & WebMCP -->
    <script>
      (function() {
        function loadDeferredScripts() {
          const deferredScripts = [
            '/telemetry.js'
          ];
          deferredScripts.forEach(function(src) {
            const script = document.createElement('script');
            script.src = src;
            script.async = true;
            script.defer = true;
            document.body.appendChild(script);
          });
        }

        if (window.requestIdleCallback) {
          window.requestIdleCallback(function() {
            setTimeout(loadDeferredScripts, 1500);
          }, { timeout: 4000 });
        } else {
          window.addEventListener('load', function() {
            setTimeout(loadDeferredScripts, 2000);
          });
        }
      })();
    </script>
  </body>
</html>
